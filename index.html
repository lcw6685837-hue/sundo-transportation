                    <div class="flex items-center bg-[#1e293b] p-1 rounded-xl border border-slate-600 shadow-md no-print">
                        <button onclick="changeDate(-1)" class="w-9 h-9 flex items-center justify-center bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-amber-400 rounded-lg transition font-bold" title="전날로 이동 (Alt+←)">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button onclick="goToday()" class="px-2.5 h-9 text-xs font-bold text-slate-300 hover:text-white transition" title="오늘 날짜로 이동">
                            오늘
                        </button>
                        <button onclick="changeDate(1)" class="w-9 h-9 flex items-center justify-center bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-amber-400 rounded-lg transition font-bold" title="다음날로 이동 (Alt+→)">
